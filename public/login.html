
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TechNova | Admin Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">

        <div class="logo">
            ⚡ TechNova
        </div>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/login.html">Admin</a>
            <a href="/leaderboard.html">🏆 Leaderboard</a>
        </div>

    </nav>


    <!-- Login Section -->
    <section class="login-section">

        <div class="login-card">

            <div class="login-icon">
                🔐
            </div>

            <h1>Admin Login</h1>

            <p>Access the TechNova event management dashboard.</p>


            <form id="loginForm">

                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Login →
                </button>

            </form>

        </div>

    </section>


    <footer>
        <p>⚡ TechNova Tech Event Management System</p>
        <p>Built for Tech Council</p>
    </footer>


    <script src="login.js"></script>

</body>

</html>
